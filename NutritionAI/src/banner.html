<!DOCTYPE html>
<html>
    <head>
        <style>
            .header {
                padding: 1px;
                top: 0;
                left: 0;
                width: 100%;
                position: fixed;
                text-align: center;
                background: rgb(118, 17, 17);
                color: white;
                font-size: 20px;
                font-family: Arial, Helvetica, sans-serif;
            }
            .iframe-container {
                margin-top: 105px; /* To ensure it's below the fixed header */
                margin-bottom: 40px; /* To ensure it's above the footer */
                width: 100%;
                height: 80vh; /* Adjust height as needed */
            }
            iframe {
                width: 100%;
                height: 100%;
                border: none;
            }
            .footer {
                position: fixed;
                left: 0;
                bottom: 0;
                width: 100%;
                background-color: rgb(118, 17, 17);
                color: white;
                text-align: center;
              }

        </style>
    </head>
    <body>
        <div class="header">
            <h1>NourishAI</h1>
        </div>

        <div class="iframe-container">
            <iframe src="http://127.0.0.1:8501"></iframe>
        </div>

        <div class="footer">
            <p>NourishAI by AIISC 2024</p>
        </div>
    </body>
</html>
